<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-label="Tableau de bord avec tous les voyants d'alerte allumés : moteur, FAP, AdBlue, préchauffage, huile, batterie, température, freins, ABS, ESP, airbag, pneus">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="75%">
      <stop offset="0" stop-color="#23272e"/>
      <stop offset="0.6" stop-color="#121418"/>
      <stop offset="1" stop-color="#060708"/>
    </radialGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2027"/>
      <stop offset="1" stop-color="#0d1014"/>
    </linearGradient>
    <linearGradient id="hood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3f47"/>
      <stop offset="1" stop-color="#1a1d22"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Fond du combiné -->
  <rect width="900" height="600" fill="url(#bg)"/>
  <path d="M0 0 H900 V40 Q450 -10 0 40 Z" fill="url(#hood)"/>

  <!-- Compteur de vitesse -->
  <g transform="translate(185 235)">
    <circle r="150" fill="#0c0e11" stroke="#3b4048" stroke-width="4"/>
    <circle r="132" fill="none" stroke="#e8ebef" stroke-width="12" stroke-dasharray="2 18.7" transform="rotate(135)" pathLength="415" opacity="0.85"/>
    <g fill="#d6dae0" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="middle">
      <text x="-78" y="76">0</text><text x="-108" y="8">40</text><text x="-78" y="-66">80</text>
      <text x="0" y="-96">120</text><text x="78" y="-66">160</text><text x="108" y="8">200</text><text x="78" y="76">240</text>
    </g>
    <text y="62" fill="#8b929c" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="middle">km/h</text>
    <line x1="0" y1="0" x2="-82" y2="82" stroke="#ff3b30" stroke-width="6" stroke-linecap="round" filter="url(#soft)"/>
    <circle r="14" fill="#2a2e35" stroke="#555b64" stroke-width="2"/>
  </g>

  <!-- Compte-tours -->
  <g transform="translate(715 235)">
    <circle r="150" fill="#0c0e11" stroke="#3b4048" stroke-width="4"/>
    <circle r="132" fill="none" stroke="#e8ebef" stroke-width="12" stroke-dasharray="2 18.7" transform="rotate(135)" pathLength="415" opacity="0.85"/>
    <path d="M 93.3 -93.3 A 132 132 0 0 1 93.3 93.3" fill="none" stroke="#ff3b30" stroke-width="12" opacity="0.9"/>
    <g fill="#d6dae0" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="middle">
      <text x="-78" y="76">0</text><text x="-108" y="8">2</text><text x="-78" y="-66">3</text>
      <text x="0" y="-96">4</text><text x="78" y="-66">5</text><text x="108" y="8">6</text><text x="78" y="76">7</text>
    </g>
    <text y="62" fill="#8b929c" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="middle">x1000 tr/min</text>
    <line x1="0" y1="0" x2="-82" y2="82" stroke="#ff3b30" stroke-width="6" stroke-linecap="round" filter="url(#soft)"/>
    <circle r="14" fill="#2a2e35" stroke="#555b64" stroke-width="2"/>
  </g>

  <!-- Écran central -->
  <g transform="translate(450 225)">
    <rect x="-95" y="-110" width="190" height="200" rx="16" fill="url(#screen)" stroke="#3b4048" stroke-width="3"/>
    <g filter="url(#glow)">
      <path d="M0 -84 L40 -14 H-40 Z" fill="none" stroke="#ffb020" stroke-width="7" stroke-linejoin="round"/>
      <rect x="-3.5" y="-64" width="7" height="28" rx="3" fill="#ffb020"/>
      <circle cy="-27" r="4.5" fill="#ffb020"/>
    </g>
    <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle" font-weight="700">
      <text y="20" fill="#ffffff" font-size="17">DÉFAUTS</text>
      <text y="42" fill="#ffffff" font-size="17">DÉTECTÉS</text>
      <text y="70" fill="#ffb020" font-size="13">Diagnostic requis</text>
    </g>
  </g>

  <!-- Bandeau des voyants -->
  <rect x="40" y="410" width="820" height="170" rx="22" fill="#0a0b0d" stroke="#2c3038" stroke-width="2"/>

  <!-- Rangée 1 -->
  <!-- Moteur (check engine) -->
  <g transform="translate(70 425)" fill="#ffb020" stroke="#ffb020" filter="url(#glow)">
    <path stroke="none" d="M8 26 h6 v-6 h10 v-4 h-6 v-4 h18 v4 h-6 v4 h10 l6 6 h4 v-4 h4 v22 h-4 v-4 h-4 l-6 8 h-26 l-4 -6 h-2 v6 h-4 v-18 h4 z"/>
  </g>
  <!-- FAP / filtre à particules -->
  <g transform="translate(170 425)" fill="none" stroke="#ffb020" stroke-width="4" stroke-linecap="round" filter="url(#glow)">
    <rect x="12" y="14" width="32" height="30" rx="5"/>
    <g fill="#ffb020" stroke="none"><circle cx="21" cy="23" r="2.6"/><circle cx="28" cy="29" r="2.6"/><circle cx="35" cy="23" r="2.6"/><circle cx="21" cy="35" r="2.6"/><circle cx="35" cy="35" r="2.6"/></g>
    <path d="M2 24 h10 M2 34 h10 M44 29 h12"/>
  </g>
  <!-- AdBlue -->
  <g transform="translate(270 425)" fill="#ffb020" stroke="#ffb020" filter="url(#glow)">
    <path stroke="none" d="M14 6 h22 v8 h-7 v6 h-8 v-6 h-7 z"/>
    <path stroke="none" d="M25 24 q-9 11 -9 17 a9 9 0 0 0 18 0 q0 -6 -9 -17 z"/>
    <path fill="none" stroke-width="3.5" stroke-linecap="round" d="M38 50 q4 -4 8 0 t8 0 M4 50 q4 -4 8 0"/>
  </g>
  <!-- Préchauffage (bougies) -->
  <g transform="translate(370 425)" fill="none" stroke="#ffb020" stroke-width="4.5" stroke-linecap="round" filter="url(#glow)">
    <path d="M4 30 h8 c0 -14 8 -14 8 0 c0 14 8 14 8 0 c0 -14 8 -14 8 0 c0 14 8 14 8 0 h8"/>
  </g>
  <!-- Huile -->
  <g transform="translate(470 425)" fill="#ff3b30" stroke="#ff3b30" filter="url(#glow)">
    <path stroke="none" d="M4 26 l10 -4 h4 v-4 h-4 v-4 h14 v4 h-4 v4 h6 l16 -6 l4 4 l-14 14 v10 h-30 v-10 l-4 -2 z"/>
    <path stroke="none" d="M54 32 q-3 5 -3 7 a3 3 0 0 0 6 0 q0 -2 -3 -7 z"/>
  </g>
  <!-- Batterie -->
  <g transform="translate(570 425)" fill="none" stroke="#ff3b30" stroke-width="4" stroke-linecap="round" filter="url(#glow)">
    <rect x="6" y="18" width="48" height="30" rx="3"/>
    <rect x="12" y="11" width="9" height="7" fill="#ff3b30" stroke="none"/>
    <rect x="39" y="11" width="9" height="7" fill="#ff3b30" stroke="none"/>
    <path d="M12 32 h10 M38 32 h10 M43 27 v10"/>
  </g>
  <!-- Température liquide de refroidissement -->
  <g transform="translate(670 425)" fill="none" stroke="#ff3b30" stroke-width="4" stroke-linecap="round" filter="url(#glow)">
    <path d="M28 6 v30"/>
    <circle cx="28" cy="40" r="6" fill="#ff3b30" stroke="none"/>
    <path d="M30 12 h8 M30 20 h8 M30 28 h8"/>
    <path d="M4 52 q6 -5 12 0 t12 0 t12 0 t12 0"/>
  </g>
  <!-- Freins -->
  <g transform="translate(770 425)" fill="none" stroke="#ff3b30" stroke-width="4" stroke-linecap="round" filter="url(#glow)">
    <circle cx="30" cy="30" r="15"/>
    <path d="M30 21 v12"/>
    <circle cx="30" cy="39" r="2.4" fill="#ff3b30" stroke="none"/>
    <path d="M10 13 A23 23 0 0 0 10 47 M50 13 A23 23 0 0 1 50 47"/>
  </g>

  <!-- Rangée 2 -->
  <!-- ABS -->
  <g transform="translate(70 505)" fill="none" stroke="#ffb020" stroke-width="4" stroke-linecap="round" filter="url(#glow)">
    <circle cx="30" cy="30" r="16"/>
    <text x="30" y="35" fill="#ffb020" stroke="none" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="middle">ABS</text>
    <path d="M9 13 A24 24 0 0 0 9 47 M51 13 A24 24 0 0 1 51 47"/>
  </g>
  <!-- ESP -->
  <g transform="translate(170 505)" fill="#ffb020" stroke="#ffb020" filter="url(#glow)">
    <path stroke="none" d="M10 32 l6 -12 h28 l6 12 v8 h-40 z"/>
    <circle cx="18" cy="40" r="4.5" fill="#0a0b0d" stroke-width="3"/>
    <circle cx="42" cy="40" r="4.5" fill="#0a0b0d" stroke-width="3"/>
    <path fill="none" stroke-width="3.5" stroke-linecap="round" d="M16 47 c5 3 -5 6 0 10 M44 47 c5 3 -5 6 0 10"/>
  </g>
  <!-- Airbag -->
  <g transform="translate(270 505)" fill="none" stroke="#ff3b30" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <circle cx="16" cy="12" r="5.5" fill="#ff3b30" stroke="none"/>
    <path d="M16 21 v16 h12 l4 14"/>
    <path d="M8 26 v16"/>
    <circle cx="40" cy="24" r="12" fill="#ff3b30" stroke="none"/>
  </g>
  <!-- Ceinture -->
  <g transform="translate(370 505)" fill="none" stroke="#ff3b30" stroke-width="4" stroke-linecap="round" filter="url(#glow)">
    <circle cx="30" cy="11" r="6" fill="#ff3b30" stroke="none"/>
    <path d="M16 54 v-22 q0 -10 14 -10 q14 0 14 10 v22"/>
    <path d="M20 24 L42 50" stroke-width="5"/>
  </g>
  <!-- Pression des pneus -->
  <g transform="translate(470 505)" fill="none" stroke="#ffb020" stroke-width="4" stroke-linecap="round" filter="url(#glow)">
    <path d="M14 12 q-8 18 0 36 M46 12 q8 18 0 36 M12 50 h36 M16 56 v-6 M24 56 v-6 M36 56 v-6 M44 56 v-6"/>
    <path d="M30 18 v16"/>
    <circle cx="30" cy="41" r="2.6" fill="#ffb020" stroke="none"/>
  </g>
  <!-- Réserve de carburant -->
  <g transform="translate(570 505)" fill="none" stroke="#ffb020" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" filter="url(#glow)">
    <rect x="12" y="10" width="22" height="40" rx="2"/>
    <rect x="16" y="15" width="14" height="10" fill="#ffb020" stroke="none"/>
    <path d="M34 20 h5 l7 7 v16 a3 3 0 0 1 -6 0 v-10 h-6"/>
    <path d="M8 52 h30"/>
  </g>
  <!-- Entretien / clé -->
  <g transform="translate(670 505)" fill="none" stroke="#ffb020" stroke-width="5" stroke-linecap="round" filter="url(#glow)">
    <path d="M12 50 L32 30"/>
    <path d="M32 30 a12 12 0 1 1 10 6" stroke-width="5"/>
    <path d="M44 12 l-6 6 l2 6 l6 2 l6 -6" stroke-width="4"/>
  </g>
  <!-- Direction assistée -->
  <g transform="translate(770 505)" fill="none" stroke="#ff3b30" stroke-width="4" stroke-linecap="round" filter="url(#glow)">
    <circle cx="26" cy="32" r="17"/>
    <circle cx="26" cy="32" r="5" fill="#ff3b30" stroke="none"/>
    <path d="M9 32 h12 M31 32 h12 M26 37 v12"/>
    <path d="M52 12 v12"/>
    <circle cx="52" cy="31" r="2.4" fill="#ff3b30" stroke="none"/>
  </g>
</svg>
